[package]
license = "MIT"
name = "clean_axum_demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[dependencies]
axum-extra = { version = "0.12.6", features = ["typed-header"] }
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.53.2", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
sea-orm = { version = "2.0.4", default-features = false, features = [
    "macros",
    "sqlx-postgres",
    "runtime-tokio",
    "with-chrono",
    "with-json",
    "with-uuid",
] }
thiserror = "2.0.21"
tower = { version = "0.5.3", features = ["timeout"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
async-trait = "0.1.92"
regex = "1.13.1"
tokio-util = "0.7.19"
http-body-util = "0.1.5"
validator = { version = "0.21.0", features = ["derive"] }
rand = "0.10.3"
argon2 = "0.6.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
chrono = "0.4.45"
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
    "env-filter",
    "registry",
    "std",
    "fmt",
    "chrono",
] }

# Optional OpenTelemetry-related crates (all `optional = true`)
opentelemetry = { version = "0.33.0", optional = true }
opentelemetry_sdk = { version = "0.33.0", optional = true }
opentelemetry-otlp = { version = "0.33.0", features = [
    "http-proto",
    "http-json",
], optional = true }
opentelemetry-appender-tracing = { version = "0.33.0", optional = true }
tracing-opentelemetry = { version = "0.34.0", optional = true }
once_cell = "1.21.4"
simple_dto_mapper_derive = "0.1.1"

[features]
opentelemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-appender-tracing",
    "dep:tracing-opentelemetry",
]
